<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Mohamed — Python, Machine Learning and Medical Data</title>
  <desc id="d">Banner with a heartbeat line turning into data points</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#0b3b3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .beat{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out .3s forwards}
      .dot{opacity:0;animation:pop .5s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pop{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- heartbeat -> data line -->
  <path class="beat" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M0 250 H120 L150 250 L170 205 L195 285 L222 160 L248 250 H330 L352 232 L374 250
           H470 C520 250 540 222 590 222 S680 262 730 236 S820 190 870 204 S960 168 1010 176 S1100 140 1200 128"/>
  <g fill="#34d399">
    <circle class="dot" style="animation-delay:2.2s" cx="590" cy="222" r="4.5"/>
    <circle class="dot" style="animation-delay:2.4s" cx="730" cy="236" r="4.5"/>
    <circle class="dot" style="animation-delay:2.6s" cx="870" cy="204" r="4.5"/>
    <circle class="dot" style="animation-delay:2.8s" cx="1010" cy="176" r="4.5"/>
    <circle class="dot" style="animation-delay:3.0s" cx="1150" cy="133" r="4.5"/>
  </g>

  <!-- text -->
  <text class="t" x="70" y="104" font-size="22" fill="#22d3ee" letter-spacing="4">PYTHON · MACHINE LEARNING · MEDICAL DATA</text>
  <text class="t" x="68" y="170" font-size="68" font-weight="700" fill="#ffffff">Mohamed</text>
  <text class="t" x="70" y="206" font-size="24" fill="#cbd5e1">Turning health data into insight, one small project at a time.</text>

  <!-- code brackets motif -->
  <text class="t" x="1040" y="90" font-size="64" font-weight="700" fill="#ffffff" fill-opacity="0.10">{ }</text>
</svg>
